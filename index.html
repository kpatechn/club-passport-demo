<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club Passport">
<meta name="theme-color" content="#0A1324">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Club Passport App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* The app commits to one dark visual world (the brand navy from the tier cards), so there is no light theme. */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --page:#070D19;--panel:#0D1628;--panel2:#132038;--line:rgba(170,195,235,.10);--line2:rgba(170,195,235,.2);
  --text:#E9EEF6;--mute:#93A1B7;--faint:#5F6E86;--gold:#D9B970;--sky:#9CC3F5;
  --ui:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --disp:'Montserrat',ui-sans-serif,system-ui,sans-serif;
}
html,body{background:var(--page);color:var(--text)}
body{font-family:var(--ui);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:8px}
img{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- presentation shell ---------- */
.bar{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding-block:20px 16px}
.logo-lock{display:flex;align-items:center;gap:14px}
.wm{font-family:var(--disp);font-weight:900;letter-spacing:.01em;line-height:1;white-space:nowrap}
.logo-lock .wm{font-size:20px}
.logo-lock .div{width:1px;height:22px;background:var(--line2)}
.logo-lock .sub{font-size:13px;color:var(--mute)}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:#1C2B47;color:#fff}
.sub-bar{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding-block:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sub-bar label{font-size:12.5px;color:var(--faint);font-weight:600;margin-right:10px}
.sub-bar .grp{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.persona-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.wrap{max-width:1320px;margin:0 auto}

.proto{display:grid;grid-template-columns:minmax(190px,230px) auto minmax(240px,310px);gap:40px;justify-content:center;align-items:start;padding-top:34px}
.notes{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px;padding-top:24px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.notes h2{font-family:var(--ui);font-weight:800;font-size:30px;line-height:1.12;letter-spacing:-.02em;margin:0;text-wrap:balance}
.notes p{margin:0;color:#BCC7D8;font-size:15px;line-height:1.6;max-width:36ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--panel);color:var(--mute)}
.src{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;max-width:36ch;line-height:1.55}
.src b{color:var(--text);font-weight:600}
.flow{position:sticky;top:16px;display:flex;flex-direction:column;gap:0;padding-top:24px;max-height:calc(100vh - 32px);overflow-y:auto;scrollbar-width:thin}
.flow h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.flow button{display:flex;gap:12px;align-items:center;text-align:left;padding:5px 10px;border-radius:8px;color:var(--mute);font-size:13px;font-weight:500;flex:none}
.flow button .k{font-size:11.5px;color:var(--faint);width:18px;font-variant-numeric:tabular-nums}
.flow button:hover{color:var(--text)}
.flow button[aria-current="true"]{background:var(--panel);color:#fff;font-weight:600}
.flow button[aria-current="true"] .k{color:var(--gold)}
.flow .hint{margin-top:14px;font-size:12px;color:var(--faint);padding-left:10px}
.stage{position:relative;display:flex;justify-content:center}
.stage::before{content:"";position:absolute;inset:-60px -120px;background:radial-gradient(closest-side,var(--glow,rgba(156,195,245,.16)),transparent);pointer-events:none;z-index:0}
.fit{position:relative;z-index:1}
.fit>.inner{position:absolute;top:0;left:0;transform-origin:0 0}

/* ---------- device ---------- */
.phone{position:relative;width:414px;height:868px;border-radius:66px;padding:5px;
  background:linear-gradient(135deg,#9AA1AD 0%,#454B57 16%,#646B79 38%,#2E333D 60%,#6E7583 84%,#A3AAB6 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 0 3px 2px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.7),0 60px 100px -40px rgba(0,0,0,.9),0 24px 48px -24px rgba(0,0,0,.7)}
.phone .bezel{width:100%;height:100%;border-radius:61px;background:#000;padding:7px;box-shadow:inset 0 0 0 1.5px #111}
.phone .hw{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2E333D,#9AA1AD 55%,#454B57)}
.phone .hw.l{left:-3px}.phone .hw.r{right:-3px;background:linear-gradient(90deg,#454B57,#9AA1AD 45%,#2E333D)}
.scr .hi{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:rgba(255,255,255,.92);z-index:45;pointer-events:none}
.scr{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;
  --bg:#0A1324;--el:#111D33;--el2:#18263F;--ink:#F3F6FB;--ink2:rgba(243,246,251,.68);--ink3:rgba(243,246,251,.44);--ln:rgba(255,255,255,.08)}
.sb{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0 42px;font-weight:700;font-size:16px;color:#fff;pointer-events:none}
.sb .isl{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.sb .ic{display:flex;gap:6px;align-items:center}
.body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:112px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.px{padding-left:20px;padding-right:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:62px 20px 6px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;padding:9px 6px 28px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(9,16,31,.78);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border-top:1px solid var(--ln);z-index:25}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--ink3)}
.tabs button[aria-current="true"]{color:var(--acc)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--ink)}
.glass{background:rgba(10,16,30,.42);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:linear-gradient(135deg,#2A3B5C,#1A2742);color:#fff}
.t1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0}
.t2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
.cap{font-size:12.5px;color:var(--ink2)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 20px 14px}
.sec h4{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sec button,.sec a{font-size:13px;color:var(--acc);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:99px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:14px;white-space:nowrap}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.btn.done{background:rgba(46,189,133,.16);color:#5FD7A5}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:20px}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.07);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.photo{position:relative;background-size:cover;background-position:center;overflow:hidden}
.photo::after{content:"";position:absolute;inset:0;background:var(--shade,linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(5,10,20,.85) 100%))}
.photo>*{position:relative;z-index:1}
.list{background:var(--el);border-radius:20px;margin:0 20px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px}
.li+.li{border-top:1px solid var(--ln)}
.li .grow{flex:1;min-width:0}
.li .k{font-size:14px;font-weight:600}
.li .v{font-size:12.5px;color:var(--ink2)}
.toast{position:absolute;left:16px;right:16px;bottom:102px;padding:14px 16px;border-radius:18px;background:#F6F8FB;color:#0A1324;font-weight:600;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 24px 50px -12px rgba(0,0,0,.65);transform:translateY(16px);opacity:0;transition:.28s ease;pointer-events:none;z-index:40}
.toast.on{transform:none;opacity:1}
.toast .ok{width:24px;height:24px;border-radius:50%;background:#2EBD85;color:#fff;display:grid;place-items:center;flex:none}

/* Club Passport member card */
.kc{position:relative;flex:none;overflow:hidden;border-radius:calc(var(--w)*.058);color:var(--ink,#fff);text-shadow:0 1px 2px rgba(0,0,0,.22);
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.26),transparent 55%),repeating-linear-gradient(118deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px),linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:0 22px 44px -22px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.18)}
.kc .brand{position:absolute;left:7%;top:10%;font-family:var(--disp);font-weight:800;font-size:calc(var(--w)*.042);letter-spacing:.2em;white-space:nowrap}
.kc .tier{position:absolute;right:6%;top:8%;font-family:var(--disp);font-weight:800;font-size:calc(var(--w)*.034);letter-spacing:.14em;padding:calc(var(--w)*.012) calc(var(--w)*.03);border-radius:99px;background:rgba(0,0,0,.24)}
.kc .word{position:absolute;left:6%;top:33%;font-family:var(--disp);font-weight:900;font-size:calc(var(--w)*.158);letter-spacing:-.02em;line-height:1;color:transparent;-webkit-text-stroke:calc(var(--w)*.004) color-mix(in srgb,var(--ink,#fff) 50%,transparent);text-shadow:none;white-space:nowrap}
.kc .no{position:absolute;left:7%;bottom:10%;font-family:var(--disp);font-weight:600;font-size:calc(var(--w)*.034);letter-spacing:.1em;line-height:1.5}
.kc .seal{position:absolute;right:6%;bottom:8%;width:calc(var(--w)*.14);height:calc(var(--w)*.14);opacity:.85}.kc .seal svg{width:100%;height:100%;display:block}

/* sheet */
.sheet{position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .pan{background:#0E1830;width:100%;border-radius:30px 30px 0 0;padding:12px 16px 34px;max-height:80%;overflow:auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 16px}

/* ---------- gallery ---------- */
.gal{padding-top:34px;display:flex;flex-direction:column;gap:56px}
.gal h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.gal .lede{color:var(--mute);margin:0 0 24px;max-width:72ch;font-size:15px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.cmp .col{display:flex;flex-direction:column;gap:14px;background:var(--panel);border-radius:22px;padding:22px}
.cmp .col.rec{box-shadow:inset 0 0 0 1.5px rgba(217,185,112,.55)}
.cmp h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.cmp .k{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cmp .rec .k{color:var(--gold)}
.cmp ul{margin:0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.cmp li{display:flex;gap:8px;align-items:flex-start;color:#C3CEDD}
.cmp li svg{flex:none;margin-top:3px}
.cmp ul.neg li{color:var(--mute)}
.cmp .use{align-self:flex-start;margin-top:auto;padding:9px 16px;border-radius:99px;background:#1C2B47;font-weight:600;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:34px 22px}
.mini{display:flex;flex-direction:column;gap:12px;cursor:pointer;align-items:flex-start}
.mini .capt b{display:block;font-size:14px;font-weight:700}
.mini .capt span{font-size:12.5px;color:var(--mute)}
.mini:hover .phone{outline:2px solid var(--sky);outline-offset:8px}
.fit.static .scr{pointer-events:none}

/* ---------- web portal ---------- */
.web{padding-top:34px;display:flex;flex-direction:column;align-items:center;gap:14px}
.browser{width:1280px;height:840px;border-radius:14px;overflow:hidden;background:#0A1324;box-shadow:0 0 0 1px #28324A,0 50px 100px -40px rgba(0,0,0,.9);display:flex;flex-direction:column;color:#EEF2F8;font-family:var(--ui)}
.bchrome{height:46px;flex:none;background:#141C2B;display:flex;align-items:center;gap:14px;padding:0 16px}
.bchrome .dots{display:flex;gap:8px}.bchrome .dots i{width:12px;height:12px;border-radius:50%;background:#394358;display:block}
.bchrome .url{flex:1;max-width:520px;margin:0 auto;height:30px;border-radius:9px;background:#0B1220;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#A5B2C6}
.pnav{height:68px;flex:none;display:flex;align-items:center;gap:34px;padding:0 40px;border-bottom:1px solid var(--line)}
.pnav .wm{font-size:18px}
.pnav nav{display:flex;gap:4px}
.pnav nav button{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--mute)}
.pnav nav button[aria-current="true"]{background:#16233C;color:#fff}
.pnav .me{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13.5px}
.pmain{flex:1;overflow-y:auto;padding:34px 40px 44px}
.pmain h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0}
.pgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.pc{background:#101B30;border-radius:20px;padding:22px}
.pc h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.pc h3 small{font-weight:500;color:var(--mute);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stats b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--mute)}
.bar2{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:5px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right}
.browser{position:relative;--bg:#0A1324;--el:#16233C;--ink:#F3F6FB;--ink2:rgba(243,246,251,.68);--ink3:rgba(243,246,251,.44);--ln:rgba(255,255,255,.09);--hi:#9CC3F5;--acc:#F3F6FB;--onacc:#0A1324}
.browser .sheet{z-index:50}.browser .sheet>div{max-width:420px}.browser .toast{left:auto;right:28px;bottom:28px;width:380px}
.pchip{height:36px;padding:0 16px;border-radius:99px;font-size:13px;font-weight:600;background:#132038;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.pchip[aria-pressed="true"]{background:#F3F6FB;color:#0A1324}.pchat .msg.ai{background:#16233C}.pchat #cqin::placeholder{color:var(--faint)}
.pocard{border-radius:18px;overflow:hidden;background:#101B30;display:flex;flex-direction:column}
.foot-note{max-width:1320px;margin:36px auto 0;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}

.flow .gh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 10px 4px}
.flow .gh:first-of-type{margin-top:0}
.spon{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.tg{width:48px;height:29px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:left .2s}
.tg[aria-checked="true"]{background:#2EBD85}.tg[aria-checked="true"]::after{left:22px}
.msg{max-width:86%;padding:12px 14px;border-radius:20px;font-size:14px;line-height:1.45}
.msg.me{align-self:flex-end;background:#2F6FE0;color:#fff;border-bottom-right-radius:6px}
.msg.ai{background:var(--el);border-bottom-left-radius:6px}
.cqai .msg.ai{max-width:calc(100% - 38px)}.cqused{margin-top:10px;padding-top:8px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);line-height:1.35}
.cqacts{display:flex;flex-wrap:wrap;gap:8px;padding-left:38px}.cqai.new,.msg.me.new{animation:cqIn .32s ease both}
.cqdots{display:flex;gap:5px;padding:4px 2px}.cqdots i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:cqDot 1s infinite}.cqdots i:nth-child(2){animation-delay:.15s}.cqdots i:nth-child(3){animation-delay:.3s}
@keyframes cqDot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}@keyframes cqIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cqin::placeholder{color:var(--ink3)}
.ctip{position:fixed;z-index:99;pointer-events:none;background:#F3F6FB;color:#0A1324;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;white-space:nowrap}
.ctip.on{opacity:1}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50}
.drawer{position:absolute;top:0;left:0;bottom:0;width:86%;background:#0B1528;z-index:51;overflow-y:auto;padding-bottom:36px;box-shadow:24px 0 60px rgba(0,0,0,.55);scrollbar-width:none}
.drawer::-webkit-scrollbar{display:none}
.drawer.anim{animation:slideIn .26s cubic-bezier(.2,.8,.2,1)}.drawer-bg.anim{animation:fadeIn .2s}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}@keyframes fadeIn{from{opacity:0}}
.dlab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dseg{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px;margin-top:8px}
.dseg button{flex:1;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink2)}
.dseg button[aria-pressed="true"]{background:#F3F6FB;color:#0A1324}

/* Game audio on phones: resume a paused context on every tap, and on game screens play a silent looping
   <audio> (plus audioSession 'playback' where supported) so iPhone's silent switch doesn't mute Web Audio. */
const GAME_SCREENS=['play','pwgame','social'];let keepAlive=null;
function silentWavUrl(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function audioKick(){if(!GAME_SCREENS.includes(S.screen))return;
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume();const src=actx.createBufferSource();src.buffer=actx.createBuffer(1,1,22050);src.connect(actx.destination);src.start(0)}catch(e){}
 try{if(!keepAlive){keepAlive=new Audio(silentWavUrl());keepAlive.loop=true;keepAlive.setAttribute('playsinline','')}if(keepAlive.paused)keepAlive.play().catch(()=>{})}catch(e){}}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,audioKick,{passive:true,capture:true}));
